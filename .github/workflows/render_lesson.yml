name: Render queued Manim lesson

on:
  workflow_dispatch:
    inputs:
      lesson_id:
        description: Supabase lesson UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manim-render-${{ github.repository }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install worker dependency
        run: pip install "supabase==2.34.1"
      - name: Pull the pinned Manim image
        run: docker pull manimcommunity/manim:v0.19.0
      - name: Render and upload lesson
        env:
          LESSON_ID: ${{ inputs.lesson_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python render_worker.py
